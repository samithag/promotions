[project]
name = "promotions-backend"
version = "0.1.0"
description = "Scrapes Sri Lankan bank card promotions and serves them over a REST API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.115",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2",
    "sqlalchemy>=2.0",
    "tenacity>=9.1.4",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
